# Speakora API — Render Blueprint (repo root)
# Creates a Python web service + PostgreSQL. Builds from backend/.
databases:
  - name: speakora-db
    plan: free
    databaseName: speakora
    user: speakora

services:
  - type: web
    name: speakora-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: speakora-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG_AUTH
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
